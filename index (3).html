<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice Helper</title>
<style>
  :root { --cyan:#6FE3FF; --blue:#1B6BE0; --deep:#040A18; --ink:#E6F6FF; --dim:#7FA6C4; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:radial-gradient(ellipse at 50% 40%, #0B2A5A 0%, #061330 45%, var(--deep) 100%); color:var(--ink);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  header { position:fixed; top:0; left:0; right:0; padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 0; display:flex; justify-content:space-between; align-items:flex-start; z-index:2; }
  #title { font-size:20px; font-weight:600; letter-spacing:.5em; color:var(--cyan); text-shadow:0 0 14px rgba(111,227,255,.6); padding-left:.5em; }
  #gear { background:none; border:1px solid rgba(111,227,255,.35); color:var(--dim); border-radius:8px; padding:8px 12px; font:inherit; font-size:14px; }
  #state { position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 58px); text-align:center; font-size:13px; letter-spacing:.3em; color:var(--cyan); z-index:2; }
  #cap { position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 84px); padding:0 24px; text-align:center; z-index:2; max-height:30vh; overflow:auto; }
  #you { color:var(--dim); font-size:15px; margin-bottom:6px; }
  #bot { font-size:19px; font-weight:500; text-shadow:0 0 12px rgba(111,227,255,.35); }
  #bar { position:fixed; left:14px; right:14px; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; gap:8px; z-index:2; }
  #txt { flex:1; font:inherit; padding:14px 16px; border-radius:28px; border:1px solid rgba(111,227,255,.4); background:rgba(4,14,34,.7); color:var(--ink); min-width:0; }
  #send { font:inherit; font-weight:600; padding:0 20px; border-radius:28px; border:1px solid var(--cyan); background:rgba(27,107,224,.35); color:var(--ink); }
  #txt:focus-visible, #send:focus-visible, #gear:focus-visible, #go:focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
  #setup { position:fixed; inset:0; background:rgba(3,8,20,.96); z-index:5; overflow:auto; padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 40px; }
  #setup .box { max-width:460px; margin:0 auto; }
  #setup h2 { letter-spacing:.2em; color:var(--cyan); font-size:20px; margin:0 0 6px; }
  #setup p { color:var(--dim); margin:0 0 16px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  #setup input, #setup select { width:100%; font:inherit; padding:14px; border-radius:10px; border:1px solid rgba(111,227,255,.4); background:#07142C; color:var(--ink); }
  #go { width:100%; margin-top:20px; font:inherit; font-weight:700; padding:16px; border-radius:12px; border:0; background:var(--cyan); color:#04101F; min-height:56px; }
  .note { font-size:14px; color:var(--dim); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<canvas id="orb" aria-hidden="true"></canvas>
<header><div id="title">JARVIS</div><button id="gear">Settings</button></header>
<div id="state" role="status" aria-live="polite">TAP THE ORB TO TALK</div>
<div id="cap"><div id="you"></div><div id="bot"></div></div>
<div id="bar"><input id="txt" placeholder="Type to your helper…" autocomplete="off"><button id="send">Send</button></div>

<div id="setup" class="hidden">
  <div class="box">
    <h2>SET UP</h2>
    <p>Do this once. Then tap the orb and talk.</p>
    <label for="name">1. Helper’s name</label>
    <input id="name" autocomplete="off" placeholder="For example: Jarvis">
    <label for="owner">2. Your name</label>
    <input id="owner" autocomplete="off" placeholder="Your name">
    <label for="prov">3. Which AI brain?</label>
    <select id="prov"><option value="gemini">Gemini (free key)</option><option value="claude">Claude (paid key)</option></select>
    <label for="key">4. Paste your API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="Paste the key here">
    <p class="note">The key is saved only on this phone. It is only sent to the AI you chose.</p>
    <button id="go">Save and start</button>
  </div>
</div>

<script>
const MODEL = "claude-sonnet-5-5";
const GEMINI_MODEL = "gemini-flash-lite-latest";
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
let history = [], busy = false, listening = false, mode = "idle";

const LABELS = { idle:"TAP THE ORB TO TALK", listening:"LISTENING", thinking:"THINKING", speaking:"SPEAKING" };
function setMode(m, text){ mode = m; $("state").textContent = text || LABELS[m]; }
function helperName(){ return (store.get("name") || "Jarvis"); }
function refreshTitle(){ $("title").textContent = helperName().toUpperCase(); }

function showSetup(on){
  $("setup").classList.toggle("hidden", !on);
}
function say(text){
  if (!("speechSynthesis" in window)) { setMode("idle"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => setMode("speaking");
  u.onend = () => setMode("idle");
  u.onerror = () => setMode("idle");
  speechSynthesis.speak(u);
}
async function ask(text){
  busy = true; setMode("thinking");
  $("you").textContent = text; $("bot").textContent = "";
  history.push({role:"user", content:text});
  const name = helperName(), owner = store.get("owner");
  try {
    const system = `You are ${name}, a friendly voice helper for ${owner}. Speak in 1 to 3 short, plain sentences. Be calm, kind and clear. No lists or symbols.`;
    let reply;
    if (store.get("prov") === "claude") {
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "content-type":"application/json", "x-api-key": store.get("key"), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({ model: MODEL, max_tokens: 400, system, messages: history.slice(-12) })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error && data.error.message || "Request failed");
      reply = data.content.map(c => c.text || "").join("").trim();
    } else {
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent", {
        method:"POST",
        headers:{ "content-type":"application/json", "x-goog-api-key": store.get("key") },
        body: JSON.stringify({
          systemInstruction: { parts:[{ text: system }] },
          contents: history.slice(-12).map(m => ({ role: m.role === "assistant" ? "model" : "user", parts:[{ text: m.content }] }))
        })
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error && data.error.message || "Request failed");
      reply = (data.candidates[0].content.parts || []).map(p => p.text || "").join("").trim();
    }
    history.push({role:"assistant", content:reply});
    $("bot").textContent = reply; say(reply);
  } catch(e) {
    history.pop(); setMode("idle");
    $("bot").textContent = "Something went wrong: " + e.message + ". Check your key in Settings, then try again.";
  }
  busy = false;
}
function listen(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { $("bot").textContent = "This browser can’t hear you. Please open this page in Chrome."; return; }
  if (busy || listening) return;
  speechSynthesis.cancel();
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onstart = () => { listening = true; setMode("listening"); };
  rec.onerror = e => { listening = false; setMode("idle"); $("bot").textContent = e.error === "not-allowed" ? "Please allow the microphone, then tap the orb again." : "I didn’t catch that. Tap the orb and try again."; };
  rec.onend = () => { listening = false; if (mode === "listening") setMode("idle"); };
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.start();
}
function sendTyped(){ const t = $("txt").value.trim(); if (!t || busy) return; $("txt").value = ""; ask(t); }

$("go").onclick = () => {
  const n = $("name").value.trim(), o = $("owner").value.trim(), k = $("key").value.trim();
  if (!n || !o || !k) { alert("Please fill in every box."); return; }
  store.set("name", n); store.set("owner", o); store.set("key", k); store.set("prov", $("prov").value);
  refreshTitle(); showSetup(false);
};
$("gear").onclick = () => { $("name").value = store.get("name"); $("owner").value = store.get("owner"); $("key").value = ""; $("prov").value = store.get("prov") || "gemini"; showSetup(true); };
$("send").onclick = sendTyped;
$("txt").addEventListener("keydown", e => { if (e.key === "Enter") sendTyped(); });
$("orb").addEventListener("click", listen);
refreshTitle();
showSetup(!(store.get("name") && store.get("key")));

/* ---------- the glowing orb ---------- */
const cv = $("orb"), x = cv.getContext("2d");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, DPR = 1;
function resize(){ DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; x.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize", resize); resize();
const rings = [ {r:.58, n:84,  len:.06, sp: .22}, {r:.74, n:120, len:.09, sp:-.14}, {r:.92, n:64, len:.05, sp:.08} ];
const dots = Array.from({length:90}, (_,i) => ({ a:Math.random()*6.283, r:.55+Math.random()*.7, s:(Math.random()-.5)*.3, z:Math.random() }));
let en = .25, last = 0, T = 0;
function frame(ts){
  const dt = Math.min((ts - last) / 1000 || 0.016, .05); last = ts;
  T += dt * (calm ? .3 : 1);
  const target = mode === "listening" ? .6 + .25*Math.sin(T*6) : mode === "thinking" ? .55 : mode === "speaking" ? .7 + .3*Math.abs(Math.sin(T*9)) : .25;
  en += (target - en) * .08;
  const spin = mode === "thinking" ? 3.2 : mode === "speaking" ? 1.6 : 1;
  const cx = W/2, cy = H*.42, R = Math.min(W, H*.8) * .34;
  x.clearRect(0,0,W,H);
  let g = x.createRadialGradient(cx,cy,R*.05, cx,cy,R*1.7);
  g.addColorStop(0, `rgba(80,210,255,${.55 + .35*en})`); g.addColorStop(.3, `rgba(27,107,224,${.35 + .2*en})`); g.addColorStop(1, "rgba(4,10,24,0)");
  x.fillStyle = g; x.fillRect(0,0,W,H);
  const core = R * (.2 + .06*en);
  g = x.createRadialGradient(cx,cy,0, cx,cy,core*1.8);
  g.addColorStop(0, "rgba(255,255,255,.95)"); g.addColorStop(.35, "rgba(130,230,255,.85)"); g.addColorStop(1, "rgba(30,120,230,0)");
  x.fillStyle = g; x.beginPath(); x.arc(cx,cy,core*1.8,0,6.283); x.fill();
  x.lineCap = "round";
  rings.forEach((rg, k) => {
    const base = R * rg.r;
    x.strokeStyle = `rgba(111,227,255,${.55 + .3*en})`; x.lineWidth = k === 1 ? 2 : 1.4;
    for (let i = 0; i < rg.n; i++) {
      const a = i / rg.n * 6.283 + T * rg.sp * spin;
      const l = R * rg.len * (.4 + .6*Math.abs(Math.sin(i*1.7 + T*3))) * (.5 + en*1.3);
      const c = Math.cos(a), s = Math.sin(a);
      x.beginPath(); x.moveTo(cx + c*base, cy + s*base); x.lineTo(cx + c*(base+l), cy + s*(base+l)); x.stroke();
    }
  });
  x.strokeStyle = "rgba(111,227,255,.35)"; x.lineWidth = 1;
  x.beginPath(); x.arc(cx,cy,R*.5,0,6.283); x.stroke();
  x.beginPath(); x.arc(cx,cy,R*1.12 + 4*en,0,6.283); x.stroke();
  dots.forEach(d => {
    d.a += d.s * dt * spin;
    const rr = R * d.r * (1 + .03*Math.sin(T + d.z*9));
    x.fillStyle = `rgba(160,235,255,${.25 + .6*d.z})`;
    x.beginPath(); x.arc(cx + Math.cos(d.a)*rr, cy + Math.sin(d.a)*rr, .8 + d.z*1.6, 0, 6.283); x.fill();
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
